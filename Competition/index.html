<!DOCTYPE html>
<html lang="en">
<head>
<title> Calculator</title>
<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">
  <div class="header">
  <h1> EMI Calculator</h1>
  </div>

<div class="main-div">

  <div class="container2">

 <div class="box1">
   <div class="content">
     <a href="#">Loan Amount</a>
   </div>
   <div class="input">
<input type="text" name="" id="loan" value="">
   </div>
 </div>

 <div class="border1">

 </div>

 <div class="box2">
   <div class="content">
     <a href="#">20K</a>
   </div>
   <div class="content">
 <a href="#">50L</a>
   </div>
 </div>

 <div class="box3">
   <div class="content">
     <a href="#">Interest Rate</a>
   </div>
   <div class="input">
<input type="text" name="" id="rate" value="">
   </div>
 </div>

 <div class="border1">

 </div>
 <div class="box4">
   <div class="content">
     <a href="#">0.1%</a>
   </div>
   <div class="content">
 <a href="#">15%</a>
   </div>
 </div>

 <div class="box5">
   <div class="content">
     <a href="#">Loan Term(Years)</a>
   </div>
   <div class="input">
<input type="text" name="" id="years" value="">
   </div>
 </div>

 <div class="border1">

 </div>
 <div class="box6">
   <div class="content">
     <a href="#">0.5Y</a>
   </div>
   <div class="content">
 <a href="#">30Y</a>
   </div>
 </div>

  </div>


  <div class="container3">
    <div>
      <canvas id="myChart"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
      const ctx = document.getElementById('myChart');


      new Chart(ctx, {
        type: 'pie',
        data: {
            labels: [ 'Blue','Orange'],
          datasets: [{
            label: '# of V',
            data: [5,12],
            borderWidth: 2
          }]
        },
        options: {
          scales: {
            y: {
              beginAtZero: true
            }
          }
        }
      });
    </script>

</div>


</div>



<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>
</html>
